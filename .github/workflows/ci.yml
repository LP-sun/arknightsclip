name: CI

on:
  push:
    branches:
      - main
      - 'chore/*'
      - 'feat/*'
      - 'fix/*'
  pull_request:
    branches:
      - main

jobs:
  test-python:
    name: Python Pipeline & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . PyYAML

      - name: Run core unit and contract tests
        run: python tests/run_tests.py

      - name: Run cards pipeline tests
        run: python psd2pen/scripts/test_cards_pipeline.py

      - name: Run template batch tests
        run: python psd2pen/scripts/test_template_batch.py

      - name: Byte-compile Python sources
        run: python -m compileall src tools psd2pen/scripts

  test-rhine:
    name: Rhine Renderer Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderers/rhine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: renderers/rhine/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Test production timeline evaluator
        run: npm test

      - name: Build production bundle
        run: npm run build
