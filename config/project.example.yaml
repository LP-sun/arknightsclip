# arknightsclip 项目全局配置文件示例
# 复制为 project.yaml 即可自定义本机配置；支持环境变量覆盖

project_root: "."

maa:
  # MaaCore 本地动态库/安装目录 (若未配置则自动从 PATH / 默认目录检索)
  maacore_path: ""
  # ADB 可执行程序路径 (留空则自动检索 MuMu / 雷电 / 环境变量 adb)
  adb_path: ""
  # 目标模拟器 ADB 连接端口
  adb_device: "127.0.0.1:16384"
  # MAA 识别模板目录
  template_dir: "maa_templates"
  # 仓库滑动翻页步长与超时配置
  swipe:
    start_x: 1550
    start_y: 540
    end_x: 350
    end_y: 540
    duration_ms: 800
    settle_delay_sec: 1.5

photoshop:
  # 渲染后端: psd_tools (跨平台/离线合成) | jsx (调用本地 Photoshop 批量脚本) | com (Win32 COM)
  backend: "psd_tools"
  # 本地 Photoshop 可执行文件路径
  exe_path: "C:\\Program Files\\Adobe\\Adobe Photoshop 2023\\Photoshop.exe"
  # 五人母版 PSD 路径
  master_template: "templates/psd/report_5p_master.psd"
  # 母版图层契约描述文件
  schema_path: "templates/psd/report_5p_schema.json"

davinci:
  fps: 24.0
  width: 1920
  height: 1080
  timeline_name: "明日方舟_六星干员报菜名_5人分层合成_v3"
  reference_video:
    enabled: false
    path: "output_video.mp4"
  audio:
    bgm_path: "明日方舟五周年_六星干员报菜名_节奏卡点全合成.mov"

pipeline:
  player_count: 5
  data_dir: "data"
  assets_dir: "assets"
  generated_dir: "generated"
  reports_dir: "reports"
  target_rarity: 6

players:
